  <g id="text" font-family="IPAexGothic, sans-serif" fill="#121212" text-anchor="middle">
    <text x="1560" y="145" font-size="25">CHO。</text><text x="1560" y="181" font-size="25">私たちは、</text><text x="1560" y="217" font-size="25">そう呼んで</text><text x="1560" y="253" font-size="25">いる。</text>
    <text x="655" y="166" font-size="23">身体を正しい</text><text x="655" y="201" font-size="23">位置へ戻す</text><text x="655" y="236" font-size="23">仕組みだと、</text><text x="655" y="271" font-size="23">考えている。</text>
    <text x="1561" y="650" font-size="24">考えて</text><text x="1561" y="686" font-size="24">いる。</text>
    <text x="173" y="646" font-size="24">まだ、</text><text x="173" y="682" font-size="24">分からない</text><text x="173" y="718" font-size="24">ことのほうが</text><text x="173" y="754" font-size="24">多い。</text>
