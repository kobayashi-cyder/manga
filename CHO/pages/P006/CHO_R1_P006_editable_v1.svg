  <g id="text" font-family="IPAexGothic, sans-serif" fill="#121212" text-anchor="middle">
    <text x="1530" y="145" font-size="24">分かれば、</text><text x="1530" y="181" font-size="24">失ったものを</text><text x="1530" y="217" font-size="24">取り戻せる人が</text><text x="1530" y="253" font-size="24">いるんですね。</text>
    <text x="705" y="160" font-size="24">今、誰かに</text><text x="705" y="197" font-size="24">約束することは</text><text x="705" y="234" font-size="24">できない。</text>
    <text x="114" y="650" font-size="24">それでも、</text><text x="114" y="687" font-size="24">確かめたい</text><text x="114" y="724" font-size="24">です。</text>
  </g>
