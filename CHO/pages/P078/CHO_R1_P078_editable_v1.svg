  <text x="1280" y="84">まず、ここに何が</text><text x="1280" y="126">残っているか。</text>
  <text x="530" y="84">設備の記録は、</text><text x="530" y="126">こっちです。</text>
  <text x="1408" y="569">データを守るん</text><text x="1408" y="611">ですか。</text>
  <text x="560" y="562">人が先だ。</text><text x="560" y="604">そのためにも、</text><text x="560" y="646">状態を確かめる。</text>
